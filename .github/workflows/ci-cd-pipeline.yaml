# Reusable CI/CD Pipeline for all Plaintext projects
#
# Jobs: CI (Build+Test+Coverage) → Deploy → Verify DEV → Verify PROD
#
# deploy-target values:
#   ci-only      – Build + Test only (no deployment)
#   snapshot-dev – Snapshot build + deploy to DEV
#   release-dev  – Release + deploy to DEV
#   release-all  – Release + deploy to DEV + deploy to PROD
#   release-only – Release (Maven-Artefakt in den Reposilite), KEIN Container-Deploy
#                  (Karte 776: Projekt stillgelegt, Bibliothek lebt weiter)
#   prod-single  – Build + Recreate der EINEN PROD-Instanz (kein blue-green, kein DEV)

name: Build And Deploy Pipeline

on:
  workflow_call:
    inputs:
      deploy-target:
        description: 'Deployment target: ci-only | snapshot-dev | release-dev | release-all | release-only | prod-single'
        required: true
        type: string
      project-name:
        description: 'Project display name (e.g. plaintext-app)'
        required: true
        type: string
      database-name:
        description: 'PostgreSQL database name for integration tests'
        required: false
        type: string
        default: 'plaintext'
      java-version:
        description: 'Java version for build and tests'
        required: false
        type: string
        default: '25'
      dev-url:
        description: 'DEV environment base URL for version check and E2E tests'
        required: false
        type: string
        default: ''
      prod-url:
        description: 'PROD environment base URL for version check and E2E tests'
        required: false
        type: string
        default: ''
      playwright-enabled:
        description: 'Run Node.js Playwright E2E tests after deployment'
        required: false
        type: boolean
        default: false
      integration-tests-enabled:
        description: 'Run Java Playwright integration tests (Maven Failsafe) against deployed app'
        required: false
        type: boolean
        default: false
      sonar-enabled:
        description: 'Run SonarQube analysis after build'
        required: false
        type: boolean
        default: false
      quality-analysis:
        description: 'Wöchentliche Voll-Analyse: nach Sonar zusätzlich OWASP-CVE + SpotBugs, Quality-Gate bewerten, bei Breach quality/quality-gate.properties committen. Erfordert sonar-enabled. (Kein Pushover mehr bei rotem Gate — Karte 401.)'
        required: false
        type: boolean
        default: false
      sonar-url:
        description: 'SonarQube server URL (vom self-hosted NAS-Runner erreichbar)'
        required: false
        type: string
        default: 'https://sonar.plaintext.ch'
      runner:
        description: 'Runner labels as JSON array (e.g. ["self-hosted","nas"] for self-hosted, ["ubuntu-latest"] for GitHub-hosted)'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      postgres-port:
        description: 'Host-Port für Postgres-Service-Container. Bei mehreren self-hosted Callern auf demselben Docker-Daemon: unique Port pro Caller (5434, 5435, ...)'
        required: false
        type: string
        default: '5434'
      scripts-ref:
        description: 'Branch/Ref von plaintext-scripts für die ./build-Skripte (Default master; zum Testen von Pipeline-Änderungen vorübergehend auf einen Branch zeigen).'
        required: false
        type: string
        default: 'master'
    secrets:
      TWINGATE_SERVICE_KEY:
        required: true
      MVN_DEPLOY_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: false
      SONAR_TOKEN:
        required: false
      PUSHOVER_APP_TOKEN:
        required: false
      PUSHOVER_USER_KEY:
        required: false
      # Karte 717: Beide werden seit jeher VERWENDET (MAVEN_NAS_TOKEN in der settings.xml des
      # deploy-Jobs, NVD_API_KEY in der OWASP-Pruefung), waren aber nie deklariert. Dass das
      # funktioniert, ist selbst der Beleg dafuer, dass `secrets: inherit` mehr durchreicht als
      # diese Liste. Wer in den aufrufenden Repos `inherit` durch eine explizite Liste ersetzt,
      # ohne die beiden hier zu deklarieren, bricht den Maven-Deploy und die OWASP-Pruefung —
      # und zwar erst zur Laufzeit, nicht beim Lint.
      #
      # `required: false`, damit kein Repo rot wird, das eines der beiden nicht besitzt (z. B.
      # kennt plaintext-guild kein NVD_API_KEY).
      MAVEN_NAS_TOKEN:
        required: false
      NVD_API_KEY:
        required: false

# ── Ressourcen-Leitplanke fuer die self-hosted NAS-Runner (Karte 351) ──────────
# Die NAS-Box hat 6 Kerne / 62 GB, davon im Leerlauf nur ~16 GB frei (qemu-VMs +
# ~14 App-Container). Ohne Cap dimensioniert jede JVM ihren Heap nach HOST-RAM:
# MaxRAMPercentage=25 % von 62 GB = ~15.5 GB max. Heap – pro Maven-JVM UND pro
# Surefire-Fork. Bei mehreren parallelen Repo-Builds (root-Release bumpt app/iot/
# schuetu/guild/fwtool gleichzeitig) lief die Box damit ins Swapping: Load 24,
# sshd kam nicht mehr durch, Blue/Green-Healthchecks liefen in Timeouts.
#
# Primaer wird das ueber cgroup-Limits auf den Runner-Containern begrenzt
# (docker update --cpus/--memory, siehe plaintext-dockercompose tri/github-runners).
# Die Env-Vars hier sind das ZWEITE Netz: sie greifen auch dann, wenn ein Runner
# ohne cgroup-Limit laeuft (z. B. frisch per `compose up` neu erzeugt).
#
# JAVA_TOOL_OPTIONS wird - anders als MAVEN_OPTS - auch von den SUREFIRE-FORKS
# geerbt; genau die sind die eigentlichen Speicherfresser (Spring-Kontexte).
#   -XX:MaxRAM=4g          -> die JVM rechnet ihre Ergonomie gegen 4 GB statt
#                             gegen 62 GB Host-RAM => ~1 GB Default-Heap.
#   -XX:ActiveProcessorCount=2 -> haelt GC-/JIT-Threadpools klein (sonst 6 pro JVM).
# MAVEN_OPTS bekommt bewusst ein hoeheres, EXPLIZITES -Xmx: in der Maven-JVM
# laeuft auch der Sonar-Scanner, der mehr Heap braucht als ein Testlauf. Ein
# explizites -Xmx auf der Kommandozeile gewinnt gegen die MaxRAM-Ergonomie.
# Summe im Worst Case (Maven 2 GB + ein Fork 1 GB + Native) bleibt unter dem
# 4-GB-cgroup-Limit des Runner-Containers; -Xmx reserviert nichts, es deckelt nur.
env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAM=4g -XX:ActiveProcessorCount=2"

jobs:
  # ── Namespace-Leitplanke (Karte 600/606/642) ───────────────────
  # Bis zum 10.08.2026 zog genau DIESE Pipeline ihre Build-Config aus
  # `daniel-marthaler/plaintext-config` und fuenf POMs ihre Java-Artefakte aus
  # `daniel-marthaler/plaintext-mvn`. Es funktionierte — ueber den Transfer-Redirect, den
  # GitHub nach einem Repo-Umzug haelt. Der faellt weg, sobald der alte Name neu besetzt
  # wird; dann liefert ein fremdes Repo Build-Config, Skripte und Maven-Artefakte.
  #
  # Warum ein eigener Job und keine GitHub-Einstellung: die Org-Actions-Allowlist greift nur
  # fuer `uses:`. Fuer `actions/checkout` mit `repository:`, fuer Maven-URLs und fuer
  # `git clone` im build-Skript gibt es keine GitHub-seitige Schranke.
  #
  # Der Job haengt bewusst an KEINEM anderen und blockiert nichts: er faerbt den Lauf rot
  # (auf dem PR sichtbar, bevor gemergt wird), haelt aber keinen Deploy auf. Kosten:
  # zwei Checkouts und ein grep.
  namespace-lint:
    name: Namespace-Lint
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    steps:
      - name: Checkout Projekt
        uses: actions/checkout@v7
        with:
          path: projekt

      - name: Checkout plaintext-scripts (Pruefskript)
        uses: actions/checkout@v7
        with:
          repository: Plaintext-Gmbh/plaintext-scripts
          ref: ${{ inputs.scripts-ref }}
          path: werkzeuge
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}

      - name: Auf den alten Namespace pruefen
        # Das Skript testet sich zuerst selbst (legt Verstoesse an und bricht ab, wenn es sie
        # NICHT findet) — sonst waere ein kaputter Check von einem sauberen Repo nicht zu
        # unterscheiden.
        run: ./werkzeuge/quality/namespace-lint.sh projekt

  # ── Build + Test + Coverage ────────────────────────────────────
  ci:
    name: Build & Test
    # M1 (build once): der Deliverable-Build läuft jetzt im deploy-Job (inkl. Unit-Tests).
    # Der separate ci-Build ist nur noch für PRs (ci-only) und den Sonar-Schedule nötig.
    if: inputs.deploy-target == 'ci-only' || inputs.sonar-enabled
    runs-on: ${{ fromJSON(inputs.runner) }}
    # 17.08.2026 (Karte 906): die concurrency-Gruppe `testdb-<project>` ist hier ENTFERNT.
    #
    # Sie war der einzige Schutz davor, dass zwei gleichzeitige Laeufe desselben Projekts einander
    # die Test-DB wegraeumen (belegt an plaintext-schuetu PR #104: push 15:57:22 und pull_request
    # 15:57:25, der push-Lauf starb an `role "plaintext" does not exist`). Der Preis war, dass ein
    # wartender Lauf verdraengt wurde (Karte 905).
    #
    # Der Grund, der bisher gegen einen dynamischen Port sprach — "scheidet aus (--network host)" —
    # ist ein Fehlschluss: `--network host` heisst, dass Postgres direkt am Host-Loopback bindet,
    # nicht dass der Port fest sein muss. Der Port steht nirgends im Anwendungscode; der Test liest
    # ihn ueber SPRING_DATASOURCE_URL aus der Umgebung (EmbeddedPg.java).
    #
    # Ersetzt durch drei zusammenhaengende Massnahmen im Schritt unten — jede einzeln waere
    # schlechter als der Status quo:
    #   1. Port aus der run-id  -> zwei Laeufe treffen sich praktisch nicht mehr
    #   2. lauf-eindeutiger Containername -> `docker rm -f` trifft nie einen fremden Lauf, auch bei
    #      einer Portkollision (ohne 2 waere die Kollision genau der alte Schaden)
    #   3. Pruefung, dass der EIGENE Container laeuft -> ohne 3 wird aus einer Kollision mit einem
    #      fremden Postgres ein STILLER Fehlschlag (Karte 906, gemessen)
    # Dazu Labels und ein eigener Cleanup-Schritt: der feste Name hatte eine unbeabsichtigte
    # Aufraeumfunktion (jeder Lauf begann mit `rm -f` auf den immer gleichen Namen), die mit
    # dynamischen Namen entfaellt — sonst laufen Waisen auf wie die ~1760 aus Karte 791.
    #
    # `deploy` behaelt seine Gruppe `deploy-<project>`: die schuetzt die Blue-Green-Slots, nicht die
    # Testdatenbank, und ist von dieser Aenderung nicht betroffen.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Start postgres on host network   # ci-Job (Karte 906)
        # Statt GH Actions services-block (der den Container in ein eigenes
        # Docker-Network packt und via -p publishet) starten wir Postgres
        # selbst mit --network host. Auf self-hosted Runnern mit network_mode:
        # host hängt der -p Port-Forward an iptables PREROUTING (eth0), nicht
        # an OUTPUT (lo) — localhost:port erreicht den Service nicht. Mit
        # --network host bindet Postgres direkt am Host-Loopback.
        env:
          DB_NAME: ${{ inputs.database-name }}
        run: |
          # PORT AUS DER RUN-ID (Karte 906), deterministisch statt "freien Port suchen" — Letzteres
          # hat eine Wettlauf-Luecke zwischen Pruefung und Belegung. `inputs.postgres-port` wird von
          # `ci` und `sonar` nicht mehr gelesen; der Input bleibt gueltig (required: false, default
          # '5434'), damit die sechs Consumer-Repos nicht angefasst werden muessen.
          # ABSICHTLICH NICHT UMGESTELLT ist der `deploy`-Job: der liest den Input weiter
          # (DEPLOY_PGPORT = PGPORT + 100). Er hat das Problem dieser Karte nicht, weil ihn
          # `deploy-<project>` ohnehin serialisiert — und diese Gruppe muss aus einem anderen Grund
          # bleiben (Blue-Green-Slots). Am PROD-ausrollenden Job ohne Not zu drehen waere das
          # groessere Risiko. Der Input ist damit noch NICHT ungenutzt; sein Entfernen setzt voraus,
          # dass auch deploy umgestellt wird, und ist eine eigene Aufraeumkarte.
          # Restrisiko: zwei gleichzeitige Laeufe mit einer run-id-Differenz von genau 10000 treffen
          # denselben Port, rechnerisch alle ~2 Wochen. Dagegen wirken die beiden Zeilen darunter.
          PGPORT=$(( 20000 + ${{ github.run_id }} % 10000 ))
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          # LAUF-EINDEUTIGER NAME: die run-id gehoert IN den Namen, nicht nur in den Port. Ein Name
          # aus dem Port allein waere bei einer Portkollision wieder mehrdeutig — und die Zeile
          # darunter beginnt mit `docker rm -f`, wuerde also den fremden Lauf mitten im Betrieb
          # loeschen. Genau dieser Fall ist fuer Karte 906 nachgebaut und gemessen worden: der
          # fremde Lauf verliert seine Test-DB und faellt danach wie ein zufaelliger Testfehler um.
          # Das Kuerzel `ci` trennt zusaetzlich von `sonar`, das im selben Lauf dieselbe run-id hat.
          CTR="ci-postgres-ci-${{ github.run_id }}"
          echo "PG_CTR=$CTR" >> "$GITHUB_ENV"
          # `rm -f -v`: postgres:18-alpine deklariert VOLUME /var/lib/postgresql, jeder Start legt
          # also ein anonymes Volume an. Ohne `-v` bleibt es als herrenlose Kopie der Test-DB auf
          # dem NAS liegen — so sind bis zum 13.08.2026 rund 1760 Stueck aufgelaufen (Karte 791).
          # Trifft jetzt nur noch den eigenen Namen. Fremde Reste raeumt der Cleanup-Schritt am
          # Jobende ueber das Label auf — der feste Name hatte diese Funktion unbeabsichtigt mit
          # uebernommen, und ohne Ersatz liefen die Waisen wieder auf.
          docker rm -f -v "$CTR" 2>/dev/null || true
          # WEGWERF-TESTDATENBANK — kein Geheimnis (Karte 812). Der Container existiert nur
          # fuer die Dauer dieses Laufs und wird oben mit `rm -f -v` wieder entfernt; er ist
          # von aussen nicht erreichbar und traegt keine echten Daten. Ein starkes Passwort
          # waere hier kein Gewinn, sondern ein starkes Passwort im Repo. Der Kommentar steht
          # da, damit die naechste Geheimnissuche diese Zeilen nicht erneut untersucht.
          # LABELS (Karte 906): der Aufraeumteil braucht ein Merkmal, das nicht am Namen haengt —
          # ein dynamischer Name ist per Definition nicht mehr erratbar. `ci-postgres=1` findet
          # alle Test-Container, `ci-run-id` sagt, zu welchem Lauf einer gehoert.
          docker run -d --name "$CTR" --network host \
            --label ci-postgres=1 \
            --label ci-run-id=${{ github.run_id }} \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER=plaintext \
            -e POSTGRES_PASSWORD=plaintext \
            --health-cmd "pg_isready -U plaintext -p $PGPORT" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            postgres:18-alpine postgres -p "$PGPORT"
          # STARTPRUEFUNG (Karte 906): ohne sie wird aus einer Portkollision ein STILLER Fehlschlag.
          # Gemessen: liegt ein fremder Postgres auf dem Port, endet der eigene Container mit
          # ExitCode 1 ("cannot bind"), und die Warteschleife unten redet dann MIT DEM FREMDEN
          # Dienst weiter — hat der eine Rolle `plaintext`, meldet sie sogar Erfolg, und die Tests
          # fallen zwei Minuten spaeter mit `role "plaintext" does not exist` oder fehlenden
          # Tabellen um (Karte 906 / project_ci_postgres_port_kollision). Die Pruefung MUSS also
          # vor der Warteschleife stehen, nicht danach.
          if [ "$(docker inspect -f '{{.State.Running}}' "$CTR" 2>/dev/null)" != "true" ]; then
            echo "::error title=Test-Postgres nicht gestartet::Der eigene Container $CTR laeuft nicht (Port $PGPORT). Wahrscheinlich liegt ein fremder Dienst auf dem Port — ohne diese Pruefung haette die Warteschleife mit ihm geredet und der Lauf waere erst in den Tests umgefallen (Karte 906)."
            docker logs "$CTR" 2>&1 | tail -20 || true
            exit 1
          fi
          # Warte bis postgres listened
          for i in $(seq 1 60); do
            if PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres on host:$PGPORT ready after ${i} tries"
              break
            fi
            sleep 3
          done
          PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" | grep -q 1 || \
          PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -c "CREATE DATABASE \"$DB_NAME\""

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          # Karte 911: `cache: maven` NUR fuer GitHub-hosted Runner. Auf den self-hosted
          # NAS-Runnern ist ~/.m2 ein persistentes Docker-Volume (github-runners_m2-cache,
          # 41 GB) — der Actions-Cache ist dort redundant UND schaedlich: er laedt einen
          # 35-GB-Eintrag herunter (bricht bei 62 % ab) und laedt das Volume danach wieder
          # hoch. Leerer Wert schaltet Restore und Save ab (setup-java: `if (cache)`),
          # deshalb `cache-jdk` explizit an, damit der JDK-Cache unveraendert bleibt.
          cache: ${{ !contains(inputs.runner, 'self-hosted') && 'maven' || '' }}
          cache-jdk: 'true'
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build & Test
        # -DexcludedGroups=quality-gate: der Quality-Gate-Wächter (QualityGateTest) liest den STATISCHEN
        # wöchentlichen Sonar-/CVE-Gate-Stand (quality/quality-gate.properties) und färbt sonst JEDEN Code-PR
        # rot, obwohl der PR-Code sauber baut/testet. Der Gate-Stand wird separat im wöchentlichen
        # quality-analysis-Lauf (Cron) bewertet + committet das Statusfile — nicht hier bei jedem PR.
        run: mvn clean install -B -DskipITs -DexcludedGroups=quality-gate
        env:
          # env.PGPORT statt inputs.postgres-port (Karte 906): der Port wird im Start-Schritt aus der
          # run-id berechnet und dort nach GITHUB_ENV geschrieben. Gleiches Muster wie im deploy-Job,
          # der env.DEPLOY_PGPORT schon so liest.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ env.PGPORT }}/${{ inputs.database-name }}
          SPRING_DATASOURCE_USERNAME: plaintext
          SPRING_DATASOURCE_PASSWORD: plaintext
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}

      - name: Generate Coverage Report
        if: always()
        run: mvn jacoco:report -B
        continue-on-error: true

      # ── Artefakt-Uploads: NUR bei Fehlschlag, Aufbewahrung 1 Tag ──────────────
      # Karte 942 (23.08.2026): Die Org laeuft auf GitHub Free (500 MB Actions-Storage
      # inklusive) und das Actions-Budget steht bewusst auf 0 $ mit "prevent further
      # usage" — es soll kein Geld an GitHub fliessen. Ist der inkludierte Speicher im
      # Monat aufgebraucht, lehnt GitHub JEDEN weiteren Upload ab
      # ("Artifact storage quota has been hit") und der Zaehler laeuft erst am 1. des
      # Folgemonats zurueck. Gemessen am 23.08.2026: 847 GB-Stunden im August, also
      # rund das 2,3-Fache des Inklusivvolumens.
      #
      # Kostentreiber waren die Uploads der ERFOLGREICHEN Laeufe: coverage-reports
      # 3,6 MB und test-results 1,5 MB pro Lauf, bei ~2 Releases/Tag ueber fuenf
      # Projekte. Niemand liest sie — im gesamten plaintext-Verbund gibt es keinen
      # einzigen download-artifact-Schritt, der sie konsumiert; die Coverage-Tabelle
      # im Job-Summary entsteht unten direkt aus dem Workspace, nicht aus dem Artefakt.
      # Bei einem gruenen Lauf ist der Report also Ballast, bei einem roten die
      # Grundlage der Nachanalyse. Deshalb failure() statt always().
      #
      # `Build & Test` traegt bewusst KEIN continue-on-error — ein Testfehler faerbt
      # den Job rot, damit failure() hier greift.
      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 1

      - name: Upload Coverage Reports
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 1

      - name: Coverage Summary
        if: always()
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
        run: |
          echo "## Code Coverage – $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          for report in $(find . -path "*/target/site/jacoco/jacoco.csv" 2>/dev/null); do
            module=$(echo "$report" | sed 's|./\(.*\)/target/.*|\1|')
            if [ -f "$report" ]; then
              missed=$(tail -n +2 "$report" | awk -F',' '{sum+=$4} END {print sum+0}')
              covered=$(tail -n +2 "$report" | awk -F',' '{sum+=$5} END {print sum+0}')
              total=$((missed + covered))
              if [ "$total" -gt 0 ]; then
                pct=$((covered * 100 / total))
                echo "| $module | ${pct}% (${covered}/${total}) |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      # NEU am 17.08.2026 (Karte 906): der ci-Job hatte KEINEN Cleanup-Schritt. Das war bisher
      # folgenlos, weil der naechste Lauf denselben festen Containernamen benutzte und mit
      # `docker rm -f` begann — eine unbeabsichtigte Aufraeumfunktion. Mit einem lauf-eindeutigen
      # Namen faellt sie weg, und ohne diesen Schritt bliebe jeder ci-Lauf als Waise liegen
      # (vgl. die ~1760 Altcontainer aus Karte 791). Der Kommentar am sonar-Cleanup nennt genau
      # diese Asymmetrie als Grund, warum ein Defekt dort lange wie ein Sonar-Problem aussah.
      - name: Stop postgres (cleanup on job-end)
        if: always()
        run: |
          if [ -n "${PG_CTR:-}" ]; then
            docker rm -f -v "$PG_CTR" 2>/dev/null || true
          else
            docker ps -aq --filter "label=ci-run-id=${{ github.run_id }}" \
              | xargs -r docker rm -f -v 2>/dev/null || true
          fi

  # ── SonarQube Analysis ──────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    needs: ci
    # !cancelled(): auch bei rotem Build & Test laufen — sonst Catch-22: Gate BREACHED/ERROR
    # → QualityGateTest lässt Build & Test scheitern → die Analyse (die das Gate wieder
    # zurücksetzen würde) wird geskippt → Gate bleibt für immer rot.
    if: inputs.sonar-enabled && !cancelled()
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Ein Lauf ohne Build-Cache dauert rund 25 Minuten (gemessen an allen vier Projekten am
    # 31.07.2026), die Voll-Analyse mit OWASP-CVE etwas länger. 90 Minuten lassen dafür Luft und
    # beenden trotzdem einen Hänger von selbst. Ohne Limit gilt GitHubs Vorgabe von 6 Stunden —
    # und ein hängender Job zählt als „Build läuft" und blockiert jede Automatik, die vor einem
    # Merge auf ein freies Fenster wartet (Karte 365: fwtool-Lauf 30619851285 blockierte den
    # Merge von PR #4 über 25 Durchläufe und musste von Hand abgebrochen werden).
    # Karte 896: 150, nicht 90 — das JOB-Timeout muss ueber dem des OWASP-Schritts (120) liegen.
    # Am 17.08.2026 standen beide auf 90: der Job startete 05:03:25Z, der OWASP-Schritt 05:06:55Z,
    # also griff das Job-Limit 3,5 Minuten VOR dem Schritt-Limit. Der Job endete auf `cancelled`,
    # `continue-on-error` am Schritt kam nie zum Tragen und die dort vorgesehene ::error::-Meldung
    # lief nicht. Deshalb hat der Timeout-Fix aus Karte 420 nie gewirkt: gemessen wurde in allen
    # fuenf Laeufen des 17.08. genau 90:19 bis 90:44 Minuten — fuenfmal das Job-Limit, keine Laufzeit.
    # Karte 896, zweite Korrektur: 180, nicht 150. Die Hierarchie 'Job > Step' stimmt
    # arithmetisch, ignorierte aber den VORLAUF vor dem OWASP-Schritt. Gemessen an zwei
    # echten Laeufen am 17.08.2026:
    #   Setup JDK 25            20:02 / 20:00 min   (Cache-Wiederherstellung, feste Groesse)
    #   SonarQube Analysis      11:00 min (root) / 1:08 min (fwtool)
    #   -> Vorlauf bis OWASP    31:28 min (root)
    # Mit Job=150 blieben real nur 118:32 fuer einen Schritt, der 120 haben darf. Der
    # root-Lauf 32017744221 starb deshalb um 12:43:07Z am JOB-Limit — 75 Sekunden VOR
    # seinem Step-Limit. Folge: SpotBugs, 'Quality-Gate bewerten' und der Rueckcommit
    # wurden geskippt, cve.high.count blieb n/a. Genau der Zustand, den Karte 896
    # beheben sollte, nur eine Ebene hoeher.
    # Rechnung fuer 180: 31 Vorlauf + 120 OWASP + 1 Gate/Commit + 4 Post-Setup = 156,
    # also 24 Minuten Reserve. Schoepft SpotBugs sein eigenes Limit von 30 voll aus,
    # reisst es — dann ist der CVE-Scan aber durch und die Meldung erscheint.
    # SOBALD NVD_API_KEY gesetzt ist (Karte 897), gehoeren Step auf ~30 und Job auf ~90.
    timeout-minutes: 180
    # 17.08.2026 (Karte 906): Gruppe `testdb-<project>` entfernt, wie im ci-Job — Begruendung dort.
    # Der Satz, der hier stand, war richtig und ist der Grund, warum die Aenderung ueberhaupt sicher
    # ist: „Innerhalb eines Laufs ist das unkritisch (needs: ci), zwischen zwei Laeufen nicht."
    # Am Lauf 32033760134 (root) nachgemessen: Build & Test 13:11:56-13:22:58, SonarQube Analysis
    # 13:23:01-15:17:24 — die Reihenfolge kommt aus `needs: ci`, nicht aus dieser Gruppe. Uebrig
    # bleibt der Fall „zwei Laeufe", und den loesen jetzt Port + Name + Startpruefung im Schritt
    # unten. Der Containername traegt zusaetzlich das Kuerzel `sonar`, damit die beiden Jobs
    # desselben Laufs (gleiche run-id!) sich nicht denselben Namen teilen.
    permissions:
      # write: die wöchentliche Voll-Analyse committet quality/quality-gate.properties zurück.
      contents: write
      packages: read

    steps:
      - name: Start postgres on host network
        # Statt GH Actions services-block (der den Container in ein eigenes
        # Docker-Network packt und via -p publishet) starten wir Postgres
        # selbst mit --network host. Auf self-hosted Runnern mit network_mode:
        # host hängt der -p Port-Forward an iptables PREROUTING (eth0), nicht
        # an OUTPUT (lo) — localhost:port erreicht den Service nicht. Mit
        # --network host bindet Postgres direkt am Host-Loopback.
        env:
          DB_NAME: ${{ inputs.database-name }}
        run: |
          # Port, Name, Labels und Startpruefung wie im ci-Job (Karte 906) — Begruendung dort im
          # Detail. Derselbe Port ist hier unbedenklich, weil `needs: ci` die beiden Jobs desselben
          # Laufs trennt; der NAME muss sich trotzdem unterscheiden, sonst raeumt der Cleanup des
          # einen Jobs dem anderen den Container weg.
          PGPORT=$(( 20000 + ${{ github.run_id }} % 10000 ))
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          CTR="ci-postgres-sonar-${{ github.run_id }}"
          echo "PG_CTR=$CTR" >> "$GITHUB_ENV"
          # `rm -f -v`: postgres:18-alpine deklariert VOLUME /var/lib/postgresql, jeder Start legt
          # also ein anonymes Volume an. Ohne `-v` bleibt es als herrenlose Kopie der Test-DB auf
          # dem NAS liegen — so sind bis zum 13.08.2026 rund 1760 Stueck aufgelaufen (Karte 791).
          docker rm -f -v "$CTR" 2>/dev/null || true
          # WEGWERF-TESTDATENBANK — kein Geheimnis (Karte 812). Der Container existiert nur
          # fuer die Dauer dieses Laufs und wird oben mit `rm -f -v` wieder entfernt; er ist
          # von aussen nicht erreichbar und traegt keine echten Daten. Ein starkes Passwort
          # waere hier kein Gewinn, sondern ein starkes Passwort im Repo. Der Kommentar steht
          # da, damit die naechste Geheimnissuche diese Zeilen nicht erneut untersucht.
          docker run -d --name "$CTR" --network host \
            --label ci-postgres=1 \
            --label ci-run-id=${{ github.run_id }} \
            -e POSTGRES_DB="$DB_NAME" \
            -e POSTGRES_USER=plaintext \
            -e POSTGRES_PASSWORD=plaintext \
            --health-cmd "pg_isready -U plaintext -p $PGPORT" \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            postgres:18-alpine postgres -p "$PGPORT"
          # STARTPRUEFUNG (Karte 906) — vor der Warteschleife, siehe ci-Job.
          if [ "$(docker inspect -f '{{.State.Running}}' "$CTR" 2>/dev/null)" != "true" ]; then
            echo "::error title=Test-Postgres nicht gestartet::Der eigene Container $CTR laeuft nicht (Port $PGPORT). Wahrscheinlich liegt ein fremder Dienst auf dem Port (Karte 906)."
            docker logs "$CTR" 2>&1 | tail -20 || true
            exit 1
          fi
          # Warte bis postgres listened
          for i in $(seq 1 60); do
            if PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres on host:$PGPORT ready after ${i} tries"
              break
            fi
            sleep 3
          done
          PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" | grep -q 1 || \
          PGPASSWORD=plaintext psql -h localhost -p "$PGPORT" -U plaintext -d postgres -c "CREATE DATABASE \"$DB_NAME\""

      - name: Connect to Twingate
        if: runner.environment != 'self-hosted'
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Token mit Push-Recht: der Quality-Gate-Schritt committet das Statusfile zurück.
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.email "github@plaintext.ch"
          git config user.name "GithubActions"

      - name: Checkout plaintext-scripts (Quality-Tools)
        if: inputs.quality-analysis
        uses: actions/checkout@v7
        with:
          repository: Plaintext-Gmbh/plaintext-scripts
          ref: ${{ inputs.scripts-ref }}
          path: .plaintext-scripts
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}

      - name: Setup JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          # Karte 911: `cache: maven` NUR fuer GitHub-hosted Runner. Auf den self-hosted
          # NAS-Runnern ist ~/.m2 ein persistentes Docker-Volume (github-runners_m2-cache,
          # 41 GB) — der Actions-Cache ist dort redundant UND schaedlich: er laedt einen
          # 35-GB-Eintrag herunter (bricht bei 62 % ab) und laedt das Volume danach wieder
          # hoch. Leerer Wert schaltet Restore und Save ab (setup-java: `if (cache)`),
          # deshalb `cache-jdk` explizit an, damit der JDK-Cache unveraendert bleibt.
          cache: ${{ !contains(inputs.runner, 'self-hosted') && 'maven' || '' }}
          cache-jdk: 'true'
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: SonarQube Analysis
        id: sonar
        env:
          # env.PGPORT statt inputs.postgres-port — siehe ci-Job (Karte 906).
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ env.PGPORT }}/${{ inputs.database-name }}
          SPRING_DATASOURCE_USERNAME: plaintext
          SPRING_DATASOURCE_PASSWORD: plaintext
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-url }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          PROJECT_KEY="${GROUP_ID}:${ARTIFACT_ID}"
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          # -DskipITs: ITs benoetigen laufende App (kein Deploy in SonarQube-Job)
          # -DexcludedGroups=quality-gate: der Gate-Wächter darf die ANALYSE nicht blocken
          # (sie ist es, die das Gate wieder auf OK bringen kann) — analog zum Deploy-Build.
          # -Pcoverage,fast: historisch — der JaCoCo-Agent steckte einmal in einem default-inaktiven
          # coverage-Profil. Beide Profile existieren heute in KEINEM der Projekte mehr (JaCoCo läuft
          # im root-POM direkt im <build>), Maven quittiert das nur mit einer WARNING. Bleibt vorerst
          # stehen: '-P' ohne die Namen könnte ein activeByDefault-Profil abschalten, und das gehört
          # in eine eigene Änderung mit eigener Beobachtung.
          #
          # -Dmaven.build.cache.enabled=false: ZWINGEND für Sonar. Mit aktivem Build-Cache
          # restauriert Maven die Module aus dem Cache ("Found cached build, restoring …"), statt sie
          # zu übersetzen — dann liegen keine target/classes auf der Platte und der Scanner bricht ab
          # mit "Your project contains .java files, please provide compiled classes with
          # sonar.java.binaries property". Genau daran scheiterte die Voll-Analyse in plaintext-root
          # am 31.07.2026 nach 20 Sekunden (Karte 365); der Cache hatte mit dem Partial-Restore-Bug
          # aus Karte 26 bereits ein verwandtes Problem. Der Lauf wird dadurch deutlich länger — das
          # ist der Preis dafür, dass er überhaupt etwas misst.
          mvn clean verify sonar:sonar -B -DskipITs -DexcludedGroups=quality-gate -Pcoverage,fast \
            -Dmaven.build.cache.enabled=false \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.projectName="${{ inputs.project-name }}" \
            -Dsonar.projectVersion="$VERSION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.java.source=${{ inputs.java-version }} \
            -Dsonar.java.target=${{ inputs.java-version }} \
            -Dsonar.scm.provider=git

      - name: SonarQube Summary
        if: always()
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          SONAR_HOST_URL: ${{ inputs.sonar-url }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout 2>/dev/null || echo "unknown")
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout 2>/dev/null || echo "unknown")
          echo "## SonarQube Analysis – $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: [$PROJECT_NAME]($SONAR_HOST_URL/dashboard?id=${GROUP_ID}:${ARTIFACT_ID})" >> $GITHUB_STEP_SUMMARY

      # ── Wöchentliche Voll-Analyse ──────────────────────────────────────────
      #
      # Karte 420: OWASP-CVE und SpotBugs liefen bis zum 05.08.2026 in EINEM Schritt mit einem
      # gemeinsamen Timeout von 45 Minuten. Folge: Wie lange der CVE-Scan allein braucht, war
      # von aussen nicht feststellbar — und genau diese Zahl entscheidet die offene Frage der
      # Karte ("CVE-Prüfung täglich?"). Ein täglicher Lauf hätte SpotBugs zwangsläufig
      # mitgeschleppt und den 5-Minuten-Nightly auf ~50 Minuten gebracht.
      #
      # Die beiden Schritte sind deshalb getrennt. Am Verhalten ändert sich nichts (beide
      # weiterhin best-effort, beide nur bei quality-analysis), an der Sichtbarkeit alles:
      # der nächste Weekly-Lauf weist die Dauer je Schritt einzeln aus. ERST DANN ist zu
      # entscheiden, ob ein schlanker täglicher CVE-Job lohnt — die Karte verlangt Messung
      # statt Vermutung.
      # TIMEOUT 90, NICHT 30 (Karte 420, gemessen am 06.08.2026): Der Schritt ist auf dem
      # KLEINSTEN Repo (fwtool) in die 30 Minuten gelaufen — "##[error]The action 'OWASP-CVE'
      # has timed out after 30 minutes". Vorher, als OWASP und SpotBugs noch einen Schritt
      # bildeten, lief er genauso in die damaligen 45 Minuten (Lauf 30804904241 vom 03.08.).
      # Der Scan ist also seit mindestens dem 03.08. NIE durchgelaufen — in keinem Repo:
      # alle sechs quality-gate.properties tragen `cve.high.count=n/a`.
      #
      # Weil der Schritt `continue-on-error: true` hat, endete er trotzdem auf "success"; es
      # entsteht kein Report ("No files were found ... dependency-check-report.json"), und
      # quality-gate.py wertet einen fehlenden Report ausdruecklich als "loest KEINEN Breach
      # aus". Ergebnis: "Quality-Gate: OK (sonar=OK, cve>=7.0=None)" — gruen, weil nichts
      # gemessen wurde. Von aussen ist das nicht von "keine CVEs gefunden" zu unterscheiden.
      #
      # 90 Minuten sind bewusst grosszuegig: Wie lange der Scan WIRKLICH braucht, weiss
      # niemand — jede bisherige Zahl war eine Timeout-Grenze, keine Laufzeit. Der naechste
      # Weekly liefert die erste echte Dauer. Faellt sie deutlich kleiner aus, gehoert der
      # Wert nachgezogen.
      - name: OWASP-CVE
        if: inputs.quality-analysis
        continue-on-error: true
        # Karte 896: 120, nicht 90 — ohne NVD_API_KEY braucht allein der NVD-Download rund 96
        # Minuten (gemessen 17.08.: 84 Minuten fuer 330.000 von 378.426 Eintraegen, dann Abbruch
        # bei 87 %). Mit 90 stirbt der Lauf JEDES Mal kurz vor dem Ziel, der Cache in
        # $HOME/.cache/owasp-dc-data bleibt unvollstaendig (gemessen: 411-722 MB, auf jedem der
        # vier Runner anders weit) und der Zustand erhaelt sich selbst. Mit 120 wird er einmal
        # fertig; danach laeuft der Scan inkrementell in Minuten.
        # SOBALD NVD_API_KEY gesetzt ist (Karte 897), gehoert dieser Wert zurueck auf ~30 —
        # mit Key ist das Rate-Limit zehnmal hoeher und 120 Minuten waeren nur noch ein Hoschlaf.
        timeout-minutes: 120
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # STALE-SCHUTZ: alte Reports aus dem wiederverwendeten Runner-Workspace löschen.
          # Sonst bewertet das Gate nach einem DC-Timeout einen veralteten Report
          # (z.B. von VOR einer Suppression-Änderung) statt gar keinen (= Sonar-only).
          find . -path "*/target/dependency-check-report.*" -delete 2>/dev/null || true
          # NVD-/RetireJS-Datenbestand. Der Kommentar hier lautete bis zum 17.08.2026
          # "persistenter NVD-Cache auf dem Runner" — und das war falsch: `docker inspect` meldete
          # fuer alle vier Runner 0 Mounts auf diesem Pfad, er lag also in der SCHREIBSCHICHT des
          # Containers. Ein `docker compose up` nach einem Image-Update loescht ihn damit; beim
          # Rollout von Karte 918 ist das real passiert, alle vier Bestaende waren danach leer,
          # darunter der einzige mit intakter jsrepository.json (deren Fehlen den RetireJS-Abbruch
          # ausgeloest hatte, Karte 914).
          #
          # Seit Karte 914 haengt hier ein benanntes Volume (github-runners: odc-cache) mit einem
          # subpath je Runner. Der PFAD bleibt derselbe — die Trennung macht das Compose, nicht
          # dieser Workflow. Deshalb steht hier auch kein Pfadwechsel, sondern nur die Pruefung,
          # dass die Persistenz wirklich da ist.
          export OWASP_DATA_DIR="$HOME/.cache/owasp-dc-data"
          mkdir -p "$OWASP_DATA_DIR"
          # KEIN stiller Rueckfall: laeuft der Job auf einem Runner mit aelterem Compose-Stand
          # (oder GitHub-hosted), ist der Pfad kein Mount und der Bestand wieder fluechtig. Ohne
          # diese Meldung waere der Unterschied erst daran zu merken, dass jeder CVE-Lauf rund
          # 84 Minuten neu laedt und dabei ins Rate-Limit laeuft (Karte 897).
          if mountpoint -q "$OWASP_DATA_DIR" 2>/dev/null; then
            echo "OWASP-Datenbestand persistent: $OWASP_DATA_DIR (Volume)"
          else
            echo "::warning title=OWASP-Cache nicht persistent::${OWASP_DATA_DIR} ist auf ${RUNNER_NAME:-diesem Runner} kein Mount — der NVD-Bestand liegt in der Container-Schreibschicht und ist beim naechsten Image-Update weg (Karte 914). Compose-Stand von github-runners pruefen."
          fi
          # Suppression-Dateien (Karte 420): ZENTRAL aus plaintext-scripts fuer Befunde, die
          # alle Repos gleichzeitig treffen -- PLUS die projekt-lokale fuer Sonderfaelle.
          # Grund: Am 08.08.2026 standen alle sechs Repos wegen DESSELBEN CVE auf BREACHED.
          # Sechs Eintraege sind sechs Gelegenheiten, einen zu vergessen -- und ein
          # vergessener sieht aus wie ein echter Fund.
          OWASP_SUPPRESSIONS=""
          if [ -f ".plaintext-scripts/quality/owasp-suppressions-zentral.xml" ]; then
            OWASP_SUPPRESSIONS=".plaintext-scripts/quality/owasp-suppressions-zentral.xml"
            echo "OWASP-Suppression (zentral): $OWASP_SUPPRESSIONS"
          fi
          if [ -f "$PWD/quality/owasp-suppressions.xml" ]; then
            OWASP_SUPPRESSIONS="${OWASP_SUPPRESSIONS:+$OWASP_SUPPRESSIONS,}$PWD/quality/owasp-suppressions.xml"
            echo "OWASP-Suppression (projekt-lokal): $PWD/quality/owasp-suppressions.xml"
          fi
          export OWASP_SUPPRESSION="$OWASP_SUPPRESSIONS"
          # ::error:: statt ::warning:: (Karte 420): Der Ausfall bedeutet, dass die CVE-Pruefung
          # dieser Woche NICHT stattgefunden hat und das Gate gleich darauf trotzdem "OK"
          # schreibt. Eine Warnung unter tausend Log-Zeilen hat das monatelang nicht sichtbar
          # gemacht. Der Lauf wird davon nicht rot — der Schritt ist weiterhin best-effort.
          # 18.08.2026 (Karte 925): DREI Faelle statt zwei. Bis heute hing die Meldung am
          # EXIT-CODE des Skripts — und der ist bei dependency-check zweideutig, weil das
          # Werkzeug den Build ABSICHTLICH rot macht, wenn Funde ueber der Schwelle liegen.
          # Der Melder las diesen roten Exit als "kein Report" und meldete "Scan NICHT
          # gelaufen", zwei Sekunden nachdem der Report geschrieben worden war. Gemessen am
          # schuetu-Lauf 32108232812 (18.08.):
          #   06:49:15  Writing HTML report to: .../dependency-check-report.html
          #   06:49:16  Writing JSON report to: ...
          #   06:49:17  [INFO] BUILD FAILURE
          #   06:49:17  ##[error]OWASP-CVE-Scan NICHT gelaufen ...
          # Folge: acht CVE-Eintraege standen im Report (darunter einer mit CVSS 9.1) und
          # wurden als "nicht gemessen" ausgegeben — der Melder tarnte genau die Funde, deren
          # Uebersehen er verhindern soll. Unterscheidungsmerkmal ist deshalb der REPORT.
          if bash .plaintext-scripts/quality/owasp-dependency-check.sh "$PWD" 0; then
            echo "OWASP-CVE-Scan durchgelaufen, kein Fund ueber der Schwelle."
          elif find . -path "*/target/dependency-check-report.json" 2>/dev/null | grep -q .; then
            echo "::warning title=CVE-Scan mit Funden::Der Scan LIEF und hat einen Report geschrieben; der Fehlercode kommt von Funden ueber der Schwelle. Das ist ein BEFUND, kein Ausfall — die CVEs stehen im Report, der als Artefakt owasp-dependency-check-${{ inputs.project-name }} am Lauf haengt (Karte 925). NICHT als 'Scan nicht gelaufen' lesen."
          else
            # NEGATIVKONTROLLE: nur DIESER Fall ist der Ausfall, den Karte 420 gemeint hat —
            # Skript rot UND kein Report. Diese Meldung muss erhalten bleiben, sonst tauscht
            # man einen Fehlalarm gegen ein Schweigen.
            echo "::error::OWASP-CVE-Scan NICHT gelaufen — es entsteht kein Report, und das Quality-Gate bewertet gleich darauf nur Sonar (cve.high.count=n/a). Grün heisst hier NICHT 'keine CVEs'."
          fi

      - name: SpotBugs
        if: inputs.quality-analysis
        continue-on-error: true
        timeout-minutes: 30
        run: |
          bash .plaintext-scripts/quality/spotbugs.sh "$PWD" Medium \
            || echo "::error::SpotBugs NICHT gelaufen — keine Bytecode-/FindSecBugs-Analyse in diesem Lauf."

      # Karte 896: Der Ausfall des CVE-Scans war UNSICHTBAR, und zwar dreifach gesichert:
      #   1. `continue-on-error: true` am OWASP-Schritt -> er endet auf "success",
      #   2. das `|| echo "::error::"` im run-Block laeuft bei einem TIMEOUT nicht mehr,
      #   3. `if-no-files-found: ignore` am Artifact-Upload schweigt ebenfalls.
      # Ergebnis: kein Report, und quality-gate.py wertet das ausdruecklich als "kein Breach"
      # -> "Quality-Gate: OK (cve>=7.0=None)". Von aussen nicht von "keine CVEs" zu
      # unterscheiden. Gemessen: am 17.08. endeten ALLE SECHS Repos nach genau 90 Minuten mit
      # `cancelled`, und laut Code-Kommentar oben ist der Scan seit mindestens dem 03.08. nie
      # durchgelaufen.
      #
      # Dieser Schritt sagt es. `if: always()` ist noetig, weil der Vorgaenger per Timeout
      # abgebrochen sein kann; die Position hier im File bestimmt die Reihenfolge, nicht das
      # always() selbst.
      - name: CVE-Report vorhanden?
        if: always() && inputs.quality-analysis
        run: |
          if find . -path "*/target/dependency-check-report.json" 2>/dev/null | grep -q .; then
            echo "CVE-Report vorhanden."
          else
            echo "::error title=CVE-Scan ohne Ergebnis::OWASP-Dependency-Check hat KEINEN Report erzeugt. Das Quality-Gate bewertet gleich darauf nur Sonar (cve.high.count=n/a) — GRUEN heisst in diesem Lauf NICHT 'keine CVEs', sondern 'nicht gemessen'. Ursache pruefen (Karte 896: NVD_API_KEY fehlt, Download laeuft ins Timeout)."
            {
              echo "### CVE-Scan ohne Ergebnis"
              echo ""
              echo "Es wurde **kein** \`dependency-check-report.json\` erzeugt. Das Quality-Gate"
              echo "bewertet in diesem Lauf **nur Sonar**; \`cve>=7.0=None\` bedeutet hier"
              echo "**nicht gemessen**, nicht **keine CVEs**."
              echo ""
              echo "Siehe Karte 896 — fehlender \`NVD_API_KEY\`, der NVD-Download laeuft ins Timeout."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Report als Artifact sichern (Runner-Workspace ist ephemer; ohne Artifact ist
      # eine Nachanalyse der gemeldeten CVEs unmöglich).
      - name: OWASP-Report als Artifact
        if: always() && inputs.quality-analysis
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-${{ inputs.project-name }}
          path: '**/target/dependency-check-report.json'
          if-no-files-found: ignore
          retention-days: 3

      # ── Quality-Gate bewerten: Sonar-Gate ERROR ODER High-CVE (CVSS>=7) ────
      - name: Quality-Gate bewerten
        if: inputs.quality-analysis
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-url }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          PROJECT_KEY="${GROUP_ID}:${ARTIFACT_ID}"
          REPORT_TASK=$(find . -path "*/target/sonar/report-task.txt" 2>/dev/null | head -1)
          OWASP_JSON=$(find . -path "*/target/dependency-check-report.json" 2>/dev/null | head -1)
          set +e
          python3 .plaintext-scripts/quality/quality-gate.py \
            --repo "$PWD" \
            --project-key "$PROJECT_KEY" \
            --sonar-url "$SONAR_HOST_URL" \
            --sonar-token "$SONAR_TOKEN" \
            --report-task "$REPORT_TASK" \
            --owasp-json "$OWASP_JSON" \
            --dashboard-url "https://plaintext-gmbh.github.io/plaintext-scripts/" | tee /tmp/gate.out
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          [ "$GATE_EXIT" = "10" ] && echo "breached=true" >> "$GITHUB_OUTPUT" || echo "breached=false" >> "$GITHUB_OUTPUT"
          grep '^  ! ' /tmp/gate.out | sed 's/^  ! //' > /tmp/breaches.txt || true
          {
            echo "## Quality-Gate – ${{ inputs.project-name }}"
            echo ""
            [ "$GATE_EXIT" = "10" ] && echo ":red_circle: **BREACHED**" || echo ":green_circle: **OK**"
            echo ""; sed 's/^/- /' /tmp/breaches.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quality-Gate-Statusfile committen
        if: inputs.quality-analysis
        run: |
          if git status --porcelain quality/quality-gate.properties | grep -q .; then
            git add quality/quality-gate.properties
            git commit -m "chore(quality): Quality-Gate-Status ${{ steps.gate.outputs.breached == 'true' && 'BREACHED' || 'OK' }} [skip-ci]"
            git push origin HEAD:${{ github.ref_name }} || {
              echo "push rejected – rebase & retry"; git pull --rebase --autostash origin ${{ github.ref_name }}; git push origin HEAD:${{ github.ref_name }};
            }
          else
            echo "Quality-Gate-Status unverändert — kein Commit."
          fi

      # Ohne diese Meldung bleibt ein Analyse-Ausfall unsichtbar: Das Quality-Gate behält seinen
      # letzten Stand, und ein altes "OK" ist von einem aktuellen nicht zu unterscheiden. Genau so
      # standen die Gates von root/schuetu/iot/fwtool wochenlang auf OK, obwohl seit dem 20.07.2026
      # keine Analyse mehr durchlief (Karte 365). Ein rotes Gate meldet sich — ein ausbleibendes
      # Ergebnis bisher nicht.
      #
      # Bewusst an den Schritt-Ausgang gebunden statt an job-level failure(): Der Job läuft
      # absichtlich auch bei rotem Build & Test (!cancelled()), und ein dort fehlgeschlagener Test
      # ist etwas anderes als eine Analyse, die nicht stattgefunden hat.
      # 'cancelled' ist bewusst mitgefasst: Genau so sah der fwtool-Lauf 30619851285 aus — der
      # Scanner lief 37 Minuten, der Job endete mit noch laufendem Java-Prozess, und in der
      # Lauf-Übersicht stand nur ein anonymes „cancelled". Ein Abbruch ist für das Gate dasselbe
      # wie ein Fehlschlag: Es hat kein neues Ergebnis bekommen und zeigt weiter seinen alten
      # Stand. Dasselbe gilt jetzt für einen Ablauf des oben gesetzten timeout-minutes.
      - name: Pushover bei Analyse-Ausfall
        if: always() && inputs.sonar-enabled && (steps.sonar.outcome == 'failure' || steps.sonar.outcome == 'cancelled')
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          bash .plaintext-scripts/quality/pushover.sh \
            "Sonar-Analyse fehlgeschlagen: ${{ inputs.project-name }}" \
            "Die Analyse lief NICHT durch — das Quality-Gate zeigt weiterhin seinen alten Stand.
          Ein dort sichtbares OK ist damit nicht aussagekräftig." \
            1 \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Lauf ansehen" \
            || echo "::warning::Pushover-Meldung zum Analyse-Ausfall konnte nicht gesendet werden."

      # Karte 608 (08.08.2026): Dieser Schritt stand als DRITTER im Job — direkt hinter
      # "Start postgres on host network" und damit VOR Checkout, Build und Analyse. Er hat also
      # die Testdatenbank weggeraeumt, bevor irgendetwas sie benutzen konnte:
      #
      #   18:47:20.277  postgres on host:5441 ready after 2 tries
      #   18:47:20.447  Run docker rm -f "ci-postgres-5441"
      #   18:51:05.163  PSQLException: Connection to localhost:5441 refused
      #                 -> Tests run: 1047, Errors: 48, BUILD FAILURE
      #
      # `if: always()` sorgt dafuer, dass ein Schritt auch nach einem Fehlschlag laeuft — es
      # verschiebt ihn NICHT ans Ende. Dafuer gibt es nur die Position. Deshalb steht er jetzt
      # hier unten, weiterhin mit `if: always()`, damit der Container auch bei rotem Lauf weg ist.
      #
      # Folge des Defekts: Der Maven-Lauf brach jedes Mal vor der Analyse ab, das
      # quality-gate.properties wurde nie neu geschrieben, und QualityGateTest blieb rot — ohne
      # dass am Code etwas falsch war. Der `ci`-Job hat den Schritt nicht und war deshalb gruen;
      # genau diese Asymmetrie liess es wie ein Sonar-Problem aussehen.
      - name: Stop postgres (cleanup on job-end)
        if: always()
        run: |
          # Eigener Container ueber PG_CTR (Karte 906) — der Name ist dynamisch und stand vorher
          # als `ci-postgres-${PGPORT}` fest hier drin. Fallback auf das Label, falls der
          # Start-Schritt gar nicht bis zum GITHUB_ENV-Schreiben kam.
          if [ -n "${PG_CTR:-}" ]; then
            docker rm -f -v "$PG_CTR" 2>/dev/null || true
          else
            docker ps -aq --filter "label=ci-run-id=${{ github.run_id }}" \
              | xargs -r docker rm -f -v 2>/dev/null || true
          fi
          # WAISEN aus abgebrochenen Laeufen (Karte 906/791). Der feste Name hat sie bisher
          # unbeabsichtigt mitentfernt, weil jeder Lauf mit `rm -f` auf denselben Namen begann.
          # Mit dynamischen Namen faellt das weg, deshalb hier ueber das Label — und ausdruecklich
          # NICHT mit `docker prune -f` (Karte 787: das trifft auch fremde Container/Volumes).
          # Nur beendete, mindestens 6 Stunden alte Test-Container: ein laufender kann zu einem
          # gleichzeitigen fremden Lauf gehoeren, und genau den nicht anzufassen ist der Zweck
          # dieser ganzen Aenderung.
          NOW=$(date +%s)
          for c in $(docker ps -aq --filter "label=ci-postgres=1" --filter "status=exited"); do
            FIN=$(docker inspect -f '{{.State.FinishedAt}}' "$c" 2>/dev/null || true)
            [ -n "$FIN" ] || continue
            FIN_S=$(date -d "$FIN" +%s 2>/dev/null || true)
            [ -n "$FIN_S" ] || continue
            AGE=$(( NOW - FIN_S ))
            if [ "$AGE" -gt 21600 ]; then
              echo "Waise entfernt: $c (beendet vor $((AGE/3600)) h)"
              docker rm -f -v "$c" 2>/dev/null || true
            fi
          done

      # ENTFERNT am 02.08.2026 (Karte 401, Auftrag Daniel): die Pushover-Meldung bei rotem
      # Quality-Gate. Wortlaut: "sorge dafuer, dass ich diese sonarqube quality gate nachrichten
      # nicht mehr bekomme. viel mehr sollen einmal in der woche eine karte erstellt werden".
      #
      # Was BLEIBT — bewusst, und nicht zu verwechseln:
      #   * Die Bewertung selbst und das eingecheckte quality/quality-gate.properties. Nur die
      #     Benachrichtigung entfaellt, nicht die Messung.
      #   * Die Meldung "Sonar-Analyse fehlgeschlagen" weiter oben. Die meldet etwas anderes:
      #     dass gar NICHT gemessen wurde. Genau dieser Ausfall blieb bei Karte 365 zehn Tage
      #     unbemerkt, mit eingefrorenem "OK" als Folge — und er verhindert zusaetzlich die
      #     Wochenkarte, die diese Meldung hier ersetzen soll. Sie zu streichen wuerde einen
      #     blinden Fleck erzeugen, der schlimmer waere als die Meldung.

  # ── Deploy ─────────────────────────────────────────────────────
  deploy:
    name: "Deploy (${{ inputs.deploy-target }})"
    # Zwei gleichzeitige Deploys desselben Projekts kollidieren doppelt: am Test-Postgres
    # `ci-postgres-deploy-<port>` (fester Port je Projekt) und an den Blue-Green-Slots. Letzteres
    # ist real passiert — ein PR-Branch-Push waehrend eines laufenden release-all belegte denselben
    # DEV-Slot, und der Deploy scheiterte mit einer irrefuehrenden Spring-Exception.
    concurrency:
      group: deploy-${{ inputs.project-name }}
      cancel-in-progress: false
    # M1 (build once): kein separater ci-Build mehr — dieser Job ist der EINZIGE Build
    # (Compile + Unit-Tests + Package) und deployt anschliessend.
    if: inputs.deploy-target != 'ci-only'
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Start postgres for build tests
        # Eigener Container/Port (PGPORT+100) — kollidiert nicht mit dem ci-Job (Sonar-Schedule).
        env:
          PGPORT: ${{ inputs.postgres-port }}
          DB_NAME: ${{ inputs.database-name }}
        run: |
          DEPLOY_PGPORT=$((PGPORT + 100))
          echo "DEPLOY_PGPORT=$DEPLOY_PGPORT" >> "$GITHUB_ENV"
          CTR="ci-postgres-deploy-${DEPLOY_PGPORT}"
          docker rm -f -v "$CTR" 2>/dev/null || true
          # WEGWERF-TESTDATENBANK — kein Geheimnis (Karte 812). Der Container existiert nur
          # fuer die Dauer dieses Laufs und wird oben mit `rm -f -v` wieder entfernt; er ist
          # von aussen nicht erreichbar und traegt keine echten Daten. Ein starkes Passwort
          # waere hier kein Gewinn, sondern ein starkes Passwort im Repo. Der Kommentar steht
          # da, damit die naechste Geheimnissuche diese Zeilen nicht erneut untersucht.
          docker run -d --name "$CTR" --network host \
            -e POSTGRES_DB="$DB_NAME" -e POSTGRES_USER=plaintext -e POSTGRES_PASSWORD=plaintext \
            --health-cmd "pg_isready -U plaintext -p $DEPLOY_PGPORT" \
            --health-interval 5s --health-timeout 3s --health-retries 12 \
            postgres:18-alpine postgres -p "$DEPLOY_PGPORT"
          for i in $(seq 1 60); do
            if PGPASSWORD=plaintext psql -h localhost -p "$DEPLOY_PGPORT" -U plaintext -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres on host:$DEPLOY_PGPORT ready after ${i} tries"; break
            fi
            sleep 3
          done
          PGPASSWORD=plaintext psql -h localhost -p "$DEPLOY_PGPORT" -U plaintext -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" | grep -q 1 || \
          PGPASSWORD=plaintext psql -h localhost -p "$DEPLOY_PGPORT" -U plaintext -d postgres -c "CREATE DATABASE \"$DB_NAME\""

      - name: Connect to Twingate
        if: runner.environment != 'self-hosted'
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.email "github@plaintext.ch"
          git config user.name "GithubActions"

      - name: Checkout plaintext-scripts
        uses: actions/checkout@v7
        with:
          repository: Plaintext-Gmbh/plaintext-scripts
          ref: ${{ inputs.scripts-ref }}
          path: plaintext-scripts
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}

      - name: Install plaintext-scripts
        run: |
          mkdir -p $HOME/codeplain
          # Ziel vorher leeren: auf wiederverwendeten Runner-Workspaces würde `cp -r` sonst INS
          # bestehende Verzeichnis kopieren und die alten Skripte stehen lassen (Änderungen wirkungslos).
          rm -rf "$HOME/codeplain/plaintext-scripts"
          cp -r plaintext-scripts "$HOME/codeplain/plaintext-scripts"
          chmod +x $HOME/codeplain/plaintext-scripts/*.sh

      - name: Checkout plaintext-config
        uses: actions/checkout@v7
        with:
          repository: Plaintext-Gmbh/plaintext-config
          path: plaintext-config
          token: ${{ secrets.MVN_DEPLOY_TOKEN }}

      - name: Install plaintext-config
        run: |
          rm -rf "$HOME/codeplain/plaintext-config"
          cp -r plaintext-config "$HOME/codeplain/plaintext-config"

      - name: Setup JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Configure Maven
        run: |
          # ── Karte 313 / Befund A2 ────────────────────────────────────────
          # settings.xml darf NICHT nach ~/.m2 geschrieben werden: /root/.m2 ist
          # das named volume "m2-cache", das ALLE Org-Runner gleichzeitig mounten
          # (plaintext-dockercompose tri/github-runners/docker-compose.yaml).
          # Nachgewiesen am 29.07.2026: identische Inode 282283678 in
          # gh-runner-org-1 UND gh-runner-org-2, Modus 0644 -> jeder parallele Job
          # JEDES Plaintext-Repos konnte MVN_DEPLOY_TOKEN und MAVEN_NAS_TOKEN im
          # Klartext mitlesen, auch Repos die diese Secrets nie bekommen sollen.
          #
          # $RUNNER_TEMP (/_work/_temp) liegt dagegen im Writable Layer des
          # jeweiligen Runner-Containers - kein Mount, laut /proc/mounts - und wird
          # vom Runner pro Job neu angelegt.
          #
          # WICHTIG (Messung 30.07.2026): MAVEN_ARGS allein traegt hier NICHT.
          # Der deploy-Job laeuft auf [self-hosted, nas, twingate], und die
          # twingate-Runner hatten /usr/bin/mvn = Apache Maven 3.6.3 (Debian-Paket);
          # MAVEN_ARGS wird erst ab Maven 3.9.0 ausgewertet:
          #   gh-runner-org-twingate-1  grep -c MAVEN_ARGS /usr/bin/mvn        -> 0
          #   gh-runner-org-1           grep -c MAVEN_ARGS .../3.9.11/bin/mvn  -> 2
          # Nur MAVEN_ARGS zu setzen und ~/.m2/settings.xml zu loeschen haette
          # jeden Deploy ohne Repo-Credentials laufen lassen.
          # Darum ein mvn-Shim in $RUNNER_TEMP/bin, das per $GITHUB_PATH vorne in
          # den PATH kommt und "-s <settings>" versionsunabhaengig erzwingt - auch
          # fuer die mvn-Aufrufe in ./build bzw. tui-build-logic.sh, ohne eine
          # einzige Call-Site anzufassen.
          #
          # STAND SEIT 17.08.2026 (Karte 918) — die Begruendung oben ist historisch:
          # alle VIER Runner fahren jetzt Maven 3.9.11 aus /opt/apache-maven-3.9.11
          # (Daniels Commit 273566c gleicht twingate/Dockerfile an, Rollout am selben
          # Abend). Das apt-Maven 3.6.3 ist auf den twingate-Runnern entfernt, im
          # Beleglauf 32060362151 meldet der deploy-Job dort:
          #   mvn-Binary: /usr/local/bin/mvn (Apache Maven 3.9.11)
          #
          # DER SHIM BLEIBT TROTZDEM, und zwar bewusst: er erzwingt "-s <settings>"
          # VERSIONSUNABHAENGIG. Ihn jetzt durch MAVEN_ARGS zu ersetzen wuerde ein
          # funktionierendes Konstrukt gegen eines tauschen, das an einer Version
          # haengt — und beim naechsten Runner mit aelterem Maven still die
          # Repo-Credentials verlieren. Wer hier aufraeumen will, braucht dafuer eine
          # eigene Karte und einen Beleg auf allen vier Runnern, nicht diesen Kommentar.
          umask 077
          cat > "$RUNNER_TEMP/settings.xml" << EOF
          <settings>
            <servers>
              <server>
                <id>plaintext</id>
                <username>daniel-marthaler</username>
                <password>${{ secrets.MVN_DEPLOY_TOKEN }}</password>
              </server>
              <!-- Privates NAS-Maven-Repo (Reposilite, maven.plaintext.ch, LAN-only).
                   root deployt dual (GH Packages + NAS), app/iot/schuetu/fwtool nur NAS.
                   Token: Org-Secret MAVEN_NAS_TOKEN (Vault: "Reposilite CI-Token"). -->
              <server>
                <id>plaintext-nas</id>
                <username>ci</username>
                <password>${{ secrets.MAVEN_NAS_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          chmod 600 "$RUNNER_TEMP/settings.xml"

          # Echtes mvn-Binary AUFLOESEN, solange das Shim noch nicht im PATH ist
          # ($GITHUB_PATH wirkt erst ab dem naechsten Step) -> keine Rekursion.
          REAL_MVN="$(command -v mvn || true)"
          if [ -z "$REAL_MVN" ]; then
            echo "::error::kein mvn im PATH gefunden - Shim kann nicht gebaut werden"
            exit 1
          fi
          echo "mvn-Binary: $REAL_MVN ($("$REAL_MVN" -v 2>/dev/null | head -1))"

          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/mvn" << SHIM
          #!/usr/bin/env bash
          # Karte 313: erzwingt die job-lokale settings.xml unabhaengig von der
          # Maven-Version (twingate-Runner: 3.6.3, kennt MAVEN_ARGS nicht).
          exec "$REAL_MVN" -s "$RUNNER_TEMP/settings.xml" "\$@"
          SHIM
          chmod 755 "$RUNNER_TEMP/bin/mvn"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          # Fuer Maven >= 3.9 zusaetzlich (harmlos, doppeltes -s: letztes gewinnt).
          echo "MAVEN_ARGS=-s $RUNNER_TEMP/settings.xml" >> "$GITHUB_ENV"

          # Die bereits im geteilten Volume liegende Alt-Datei mitnehmen.
          rm -f ~/.m2/settings.xml

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 192.168.1.224 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H 192.168.0.7 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build & Deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          CI: 'true'
          DEPLOY_TARGET: ${{ inputs.deploy-target }}
          # M1: Unit-Tests laufen im einzigen Build mit (ITs separat) -> Test-DB nötig.
          # Fast-Mode: Commit-Marker [fast] in der Message überspringt ALLE Tests (-DskipTests).
          # -DexcludedGroups=quality-gate: der Quality-Gate-Wächter (QualityGateTest) darf den DEPLOY
          # NICHT blockieren (Hotfix muss trotz aktivem Alert-File rausgehen können). Er läuft dafür in
          # nightly/PR/lokal voll mit und färbt dort rot -> Handlungsbedarf bleibt sichtbar.
          MVN_TEST_FLAG: ${{ contains(github.event.head_commit.message, '[fast]') && '-DskipTests' || '-DskipITs -DexcludedGroups=quality-gate' }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ env.DEPLOY_PGPORT }}/${{ inputs.database-name }}
          SPRING_DATASOURCE_USERNAME: plaintext
          SPRING_DATASOURCE_PASSWORD: plaintext
        run: |
          chmod +x ./build
          case "$DEPLOY_TARGET" in
            snapshot-dev)
              echo "=== Snapshot Build + Deploy DEV ==="
              ./build build deploy
              ;;
            release-dev)
              echo "=== Release + Deploy DEV ==="
              ./build release deploy-healthcheck
              ;;
            release-all)
              echo "=== Release + Deploy DEV + PROD ==="
              ./build 56
              ;;
            release-only)
              # Karte 776: fuer ein Projekt, dessen CONTAINER stillgelegt ist, dessen
              # MAVEN-ARTEFAKT aber weiterlebt (plaintext-root ist der Parent-POM von app,
              # guild, schuetu und iot). `./build release` ohne Deploy-Argument macht
              # `mvn clean deploy` in den Reposilite, Version-Bump, Tag und Push — die
              # Aufrufe von deploy_to_dev/deploy_to_prod bleiben aus, es entsteht also kein
              # Container. Ohne dieses Ziel gaebe es nur die Wahl zwischen "gar kein
              # Release" (ci-only) und "Release samt Container-Deploy" (release-all).
              echo "=== Release (Maven-Artefakt) OHNE Container-Deploy ==="
              ./build release
              ;;
            prod-single)
              echo "=== Single PROD instance (kein blue-green, kein DEV) ==="
              ./build build prod-single
              ;;
            *)
              echo "Unknown deploy target: $DEPLOY_TARGET"
              exit 1
              ;;
          esac

      - name: Stop postgres (deploy cleanup)
        if: always()
        run: docker rm -f -v "ci-postgres-deploy-${DEPLOY_PGPORT}" 2>/dev/null || true

      - name: Secrets vom Runner entfernen (cleanup on job-end)
        if: always()
        run: |
          # ── Karte 313 / Befund A3 ────────────────────────────────────────
          # EPHEMERAL=true beendet nur den Runner-PROZESS; "restart: unless-stopped"
          # startet denselben Container mit unveraendertem Writable Layer neu.
          # /root/.ssh/id_rsa blieb dadurch fuer den naechsten Job eines FREMDEN
          # Repos lesbar. Nachgewiesen am 29.07.2026: in allen drei laufenden
          # Runnern lagen Keys aus alten Jobs (gh-runner-org-twingate-1 sogar ein
          # id_deploy samt ~/.ssh/config vom 23.07., also sechs Tage alt).
          # Dieser Schritt laeuft mit if: always() und darf den Job nie roetfaerben.
          shred -u ~/.ssh/id_rsa ~/.ssh/id_deploy 2>/dev/null || \
            rm -f ~/.ssh/id_rsa ~/.ssh/id_deploy 2>/dev/null || true
          # ~/.ssh/config wird von der deploy-Action per ">>" ANGEHAENGT und wuchs
          # dadurch ueber Jobs hinweg an.
          rm -f ~/.ssh/config 2>/dev/null || true
          shred -u "$RUNNER_TEMP/settings.xml" 2>/dev/null || \
            rm -f "$RUNNER_TEMP/settings.xml" 2>/dev/null || true
          rm -f ~/.m2/settings.xml 2>/dev/null || true
          exit 0

      - name: Deploy Summary
        if: always()
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          DEPLOY_TARGET: ${{ inputs.deploy-target }}
        run: |
          echo "## Deploy Summary – $PROJECT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`$DEPLOY_TARGET\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || grep -m1 '<version>' pom.xml | sed 's/.*<version>//;s/<\/version>.*//' | tr -d ' ') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release** | $(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo 'n/a') |" >> $GITHUB_STEP_SUMMARY

  # ── Verify DEV ─────────────────────────────────────────────────
  verify-dev:
    name: Verify DEV
    needs: deploy
    # Karte 776: `release-only` deployt bewusst keinen Container — es gibt dann auch kein DEV
    # zu verifizieren. Ohne diesen Ausschluss wuerde der Verify-Schritt eine stillgelegte
    # Umgebung anpingen und den ansonsten gelungenen Release rot faerben.
    if: inputs.deploy-target != 'ci-only' && inputs.deploy-target != 'release-only' && inputs.dev-url != ''
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Connect to Twingate
        if: runner.environment != 'self-hosted'
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Version Check DEV
        id: verify_dev
        env:
          DEV_URL: ${{ inputs.dev-url }}
        run: |
          echo "Verifying DEV at $DEV_URL/nosec/version ..."
          # WICHTIG: Der Deploy-Job ist die AUTORITATIVE Gesundheits-Schranke (Blue-Green-Healthcheck
          # vor dem Traffic-Switch). Dieser Poll bestaetigt nur und ist Voraussetzung fuer die E2E-Tests.
          # Ein transienter Ausfall (langsamer Re-Start, nginx-Upstream-Glitch am int-Slot) darf die
          # Pipeline daher NICHT rot faerben -> bei Timeout: Warnung + up=false (KEIN exit 1).
          # E2E-Tests laufen nur bei up=true; echte Test-Fehlschlaege faerben weiterhin rot.
          up=false
          for i in $(seq 1 90); do
            if RESPONSE=$(curl -sf "$DEV_URL/nosec/version" 2>/dev/null); then
              echo "DEV running: $RESPONSE"
              echo "## Verify DEV" >> $GITHUB_STEP_SUMMARY
              echo "Version: \`$RESPONSE\` :white_check_mark:" >> $GITHUB_STEP_SUMMARY
              up=true; break
            fi
            echo "Waiting for DEV... ($i/90)"
            sleep 5
          done
          if [ "$up" != "true" ]; then
            echo "::warning title=Verify DEV::DEV /nosec/version nach 7.5 min nicht erreichbar — Deploy-Gate war bereits gruen, daher nur Warnung (kein Fehlschlag); E2E uebersprungen."
            echo "## Verify DEV" >> $GITHUB_STEP_SUMMARY
            echo ":warning: DEV nach 7.5 min nicht erreichbar (transient; Deploy war erfolgreich) — E2E uebersprungen." >> $GITHUB_STEP_SUMMARY
          fi
          echo "up=$up" >> "$GITHUB_OUTPUT"

      # ── Java Integration Tests (Maven Failsafe) ──
      - name: Checkout
        if: inputs.integration-tests-enabled || inputs.playwright-enabled
        uses: actions/checkout@v7

      - name: Setup JDK ${{ inputs.java-version }}
        if: inputs.integration-tests-enabled
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          # Karte 911: `cache: maven` NUR fuer GitHub-hosted Runner. Auf den self-hosted
          # NAS-Runnern ist ~/.m2 ein persistentes Docker-Volume (github-runners_m2-cache,
          # 41 GB) — der Actions-Cache ist dort redundant UND schaedlich: er laedt einen
          # 35-GB-Eintrag herunter (bricht bei 62 % ab) und laedt das Volume danach wieder
          # hoch. Leerer Wert schaltet Restore und Save ab (setup-java: `if (cache)`),
          # deshalb `cache-jdk` explizit an, damit der JDK-Cache unveraendert bleibt.
          cache: ${{ !contains(inputs.runner, 'self-hosted') && 'maven' || '' }}
          cache-jdk: 'true'
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install Playwright Browser
        if: inputs.integration-tests-enabled
        run: npx playwright install --with-deps chromium

      - name: Integration Tests (DEV)
        if: inputs.integration-tests-enabled && steps.verify_dev.outputs.up == 'true'
        # Sicherheitsnetz: 'mvn verify' startet via spring-boot-maven-plugin teils einen lokalen
        # Server (pre-integration-test). Fehlt auf dem Runner die DB, haengt der Start sonst
        # praktisch unbegrenzt (Default-Job-Timeout 6h) -> Pipeline wird nie gruen, obwohl der
        # Deploy laengst erfolgreich war. Hartes Step-Limit -> schneller, klarer Fehlschlag.
        timeout-minutes: 12
        run: mvn verify -B -Dsurefire.skip=true "-Dtest.server.url=$DEV_URL"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          DEV_URL: ${{ inputs.dev-url }}

      - name: Upload Integration Test Results (DEV)
        if: inputs.integration-tests-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: integration-test-results-dev
          path: '**/target/failsafe-reports/*.xml'
          retention-days: 1

      - name: Upload Screenshots (DEV)
        if: inputs.integration-tests-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: playwright-screenshots-dev
          path: '**/target/screenshots/'
          retention-days: 1
          if-no-files-found: ignore

      # ── Node.js Playwright Tests ──
      - name: Setup Node.js
        if: inputs.playwright-enabled
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node.js Playwright
        if: inputs.playwright-enabled
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E Tests (DEV)
        if: inputs.playwright-enabled && steps.verify_dev.outputs.up == 'true'
        timeout-minutes: 10
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.dev-url }}

      - name: Upload Playwright Report (DEV)
        if: inputs.playwright-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: playwright-report-dev
          path: playwright-report/
          retention-days: 1

  # ── Verify PROD ────────────────────────────────────────────────
  verify-prod:
    name: Verify PROD
    # Unabhaengig von Verify DEV: ein flaky DEV-Verify darf die PROD-Verifikation nicht ueberspringen.
    needs: deploy
    if: inputs.deploy-target == 'release-all' && inputs.prod-url != ''
    runs-on: ${{ fromJSON(inputs.runner) }}

    steps:
      - name: Connect to Twingate
        if: runner.environment != 'self-hosted'
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Version Check PROD
        id: verify_prod
        env:
          PROD_URL: ${{ inputs.prod-url }}
        run: |
          echo "Verifying PROD at $PROD_URL/nosec/version ..."
          # Wie Verify DEV: der Deploy-Job ist die autoritative Gesundheits-Schranke. Dieser Poll
          # bestaetigt nur + ist Voraussetzung der E2E-Tests; ein transienter Ausfall faerbt die
          # Pipeline NICHT rot (Warnung + up=false). E2E laufen nur bei up=true.
          up=false
          for i in $(seq 1 90); do
            if RESPONSE=$(curl -sf "$PROD_URL/nosec/version" 2>/dev/null); then
              echo "PROD running: $RESPONSE"
              echo "## Verify PROD" >> $GITHUB_STEP_SUMMARY
              echo "Version: \`$RESPONSE\` :white_check_mark:" >> $GITHUB_STEP_SUMMARY
              up=true; break
            fi
            echo "Waiting for PROD... ($i/90)"
            sleep 5
          done
          if [ "$up" != "true" ]; then
            echo "::warning title=Verify PROD::PROD /nosec/version nach 7.5 min nicht erreichbar — Deploy-Gate war bereits gruen, daher nur Warnung (kein Fehlschlag); E2E uebersprungen."
            echo "## Verify PROD" >> $GITHUB_STEP_SUMMARY
            echo ":warning: PROD nach 7.5 min nicht erreichbar (transient; Deploy war erfolgreich) — E2E uebersprungen." >> $GITHUB_STEP_SUMMARY
          fi
          echo "up=$up" >> "$GITHUB_OUTPUT"

      # ── Java Integration Tests (Maven Failsafe) ──
      - name: Checkout
        if: inputs.integration-tests-enabled || inputs.playwright-enabled
        uses: actions/checkout@v7

      - name: Setup JDK ${{ inputs.java-version }}
        if: inputs.integration-tests-enabled
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          # Karte 911: `cache: maven` NUR fuer GitHub-hosted Runner. Auf den self-hosted
          # NAS-Runnern ist ~/.m2 ein persistentes Docker-Volume (github-runners_m2-cache,
          # 41 GB) — der Actions-Cache ist dort redundant UND schaedlich: er laedt einen
          # 35-GB-Eintrag herunter (bricht bei 62 % ab) und laedt das Volume danach wieder
          # hoch. Leerer Wert schaltet Restore und Save ab (setup-java: `if (cache)`),
          # deshalb `cache-jdk` explizit an, damit der JDK-Cache unveraendert bleibt.
          cache: ${{ !contains(inputs.runner, 'self-hosted') && 'maven' || '' }}
          cache-jdk: 'true'
          server-id: plaintext
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Install Playwright Browser
        if: inputs.integration-tests-enabled
        run: npx playwright install --with-deps chromium

      - name: Integration Tests (PROD)
        if: inputs.integration-tests-enabled && steps.verify_prod.outputs.up == 'true'
        # Siehe Verify DEV: hartes Step-Limit gegen haengenden lokalen Server-Start.
        timeout-minutes: 12
        run: mvn verify -B -Dsurefire.skip=true "-Dtest.server.url=$PROD_URL"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          PROD_URL: ${{ inputs.prod-url }}

      - name: Upload Integration Test Results (PROD)
        if: inputs.integration-tests-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: integration-test-results-prod
          path: '**/target/failsafe-reports/*.xml'
          retention-days: 1

      - name: Upload Screenshots (PROD)
        if: inputs.integration-tests-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: playwright-screenshots-prod
          path: '**/target/screenshots/'
          retention-days: 1
          if-no-files-found: ignore

      # ── Node.js Playwright Tests ──
      - name: Setup Node.js
        if: inputs.playwright-enabled
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Node.js Playwright
        if: inputs.playwright-enabled
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E Tests (PROD)
        if: inputs.playwright-enabled && steps.verify_prod.outputs.up == 'true'
        timeout-minutes: 10
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.prod-url }}

      - name: Upload Playwright Report (PROD)
        if: inputs.playwright-enabled && failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Artefakt-Upload ist nur Convenience/Reporting; darf die Pipeline nicht wegen Storage-Quota o.ae. scheitern lassen
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 1
