name: Quality Dashboard

# Wöchentliche Gesamt-Übersicht über alle Plaintext-Spring-Projekte (Sonar-Kennzahlen,
# Quality-Gate-Status, CI, PRs) als HTML auf GitHub Pages. Läuft NACH den wöchentlichen
# Projekt-Voll-Analysen (die ihre Sonar-Daten + Gate-Files liefern).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Montag 06:00 UTC — nach den Projekt-Analysen (04:00)

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Pages-Deploys gleichzeitig.
concurrency:
  group: quality-dashboard
  cancel-in-progress: true

jobs:
  build:
    name: Dashboard generieren
    # ubuntu-latest statt self-hosted (30.08.2026): Der Job braucht kein LAN. Er ruft
    # ausschliesslich die SonarQube-REST-API unter https://sonar.plaintext.ch (von aussen
    # erreichbar, nachgemessen HTTP 200) und die GitHub-API; quality-dashboard.py kommt mit
    # der Standardbibliothek aus (urllib), ohne Maven und ohne Docker.
    #
    # Warum dieser Workflow NICHT nach Woodpecker zieht wie der Rest der Familie: Der
    # zweite Job veroeffentlicht ueber actions/deploy-pages auf GitHub Pages. Das ist ein
    # GitHub-Dienst; Woodpecker koennte ihn nur ersetzen, wenn das Dashboard woanders
    # gehostet wuerde. Auf ubuntu-latest gibt der Job trotzdem den self-hosted Runner frei,
    # und darum ging es.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dashboard erzeugen
        env:
          # PAT mit org-weitem Read (Runs/PRs/CodeQL/Gate-Files aller Repos).
          GH_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          SONAR_URL: 'https://sonar.plaintext.ch'
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p public
          python3 quality/quality-dashboard.py public/index.html
          cp public/index.html public/quality.html   # zusätzlicher sprechender Name

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: build
    # ubuntu-latest statt self-hosted (30.08.2026): Der Job braucht kein LAN. Er ruft
    # ausschliesslich die SonarQube-REST-API unter https://sonar.plaintext.ch (von aussen
    # erreichbar, nachgemessen HTTP 200) und die GitHub-API; quality-dashboard.py kommt mit
    # der Standardbibliothek aus (urllib), ohne Maven und ohne Docker.
    #
    # Warum dieser Workflow NICHT nach Woodpecker zieht wie der Rest der Familie: Der
    # zweite Job veroeffentlicht ueber actions/deploy-pages auf GitHub Pages. Das ist ein
    # GitHub-Dienst; Woodpecker koennte ihn nur ersetzen, wenn das Dashboard woanders
    # gehostet wuerde. Auf ubuntu-latest gibt der Job trotzdem den self-hosted Runner frei,
    # und darum ging es.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
