name: Quality Dashboard

# Wöchentliche Gesamt-Übersicht über alle Plaintext-Spring-Projekte (Sonar-Kennzahlen,
# Quality-Gate-Status, CI, PRs) als HTML auf GitHub Pages. Läuft NACH den wöchentlichen
# Projekt-Voll-Analysen (die ihre Sonar-Daten + Gate-Files liefern).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Montag 06:00 UTC — nach den Projekt-Analysen (04:00)

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Pages-Deploys gleichzeitig.
concurrency:
  group: quality-dashboard
  cancel-in-progress: true

jobs:
  build:
    name: Dashboard generieren
    runs-on: ['self-hosted', 'nas']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dashboard erzeugen
        env:
          # PAT mit org-weitem Read (Runs/PRs/CodeQL/Gate-Files aller Repos).
          GH_TOKEN: ${{ secrets.MVN_DEPLOY_TOKEN }}
          SONAR_URL: 'https://sonar.plaintext.ch'
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p public
          python3 quality/quality-dashboard.py public/index.html
          cp public/index.html public/quality.html   # zusätzlicher sprechender Name

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Auf GitHub Pages veröffentlichen
    needs: build
    runs-on: ['self-hosted', 'nas']
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
